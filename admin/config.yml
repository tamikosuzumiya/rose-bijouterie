backend:
  name: git-gateway
  branch: main

media_folder: "assets/productos"
public_folder: "/assets/productos"

collections:
  - name: "productos_tienda"
    label: "Productos"
    folder: "data"
    extension: "json"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Nombre del Producto", name: "title", widget: "string" }
      - { label: "Precio", name: "precio", widget: "number", value_type: "int" }
      - { label: "Categoría", name: "categoria", widget: "select", options: ["Anillos", "Collares", "Pulseras", "Pendientes", "Accesorios"] }
      - { label: "Imagen", name: "imagen", widget: "image" }
      - { label: "Color disponible", name: "color", widget: "string", required: false }
      
